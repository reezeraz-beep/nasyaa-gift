<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Для Насти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#120d1c;--pink:#ff2e88;--cy:#2ee6d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated}
#sky{position:fixed;inset:0;background:radial-gradient(circle at 50% 115%,#5b1e78,transparent 60%),linear-gradient(#090521,#1d0b44)}
.sk{position:absolute;width:3px;height:3px;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.v{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;pointer-events:none;transform:scale(.985);transition:opacity .9s ease,transform .9s ease,visibility 0s linear .9s}
.v.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
@keyframes bl{50%{opacity:0}}
/* плашка */
#tp{cursor:pointer}
.pb{background:var(--ink);border:4px solid var(--pink);box-shadow:-6px 6px 0 var(--cy);padding:28px 22px;text-align:center;max-width:340px;animation:pbin .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pbin{from{transform:scale(.5);opacity:0}}
#paw{width:90px;height:78px;margin-bottom:20px;animation:tap 1.2s ease-in-out infinite}
@keyframes tap{50%{transform:translateY(10px) scale(.94)}}
.pb div{font-size:12px;line-height:2.1;color:#c7f7ff;text-shadow:2px 2px 0 #7a1b7a}
/* загрузка */
.lw{width:min(84vw,360px);display:flex;flex-direction:column;align-items:center}
#bub{width:100%;height:104px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:22px}
#bt{position:relative;background:#fff;color:#120d1c;border:4px solid #120d1c;box-shadow:4px 4px 0 var(--pink);padding:10px 12px;font-size:10px;line-height:1.8;text-align:center;opacity:0;transform:translateY(10px) scale(.9);transition:opacity .3s,transform .35s cubic-bezier(.2,1.5,.4,1)}
#bt.on{opacity:1;transform:none}
#bt:after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-8px;border:8px solid transparent;border-top-color:#120d1c;border-bottom:0}
#bt .ov{position:absolute;left:12px;right:12px;top:10px}
#lc{position:relative;width:96px;margin-bottom:22px;cursor:pointer;animation:fl 2.4s ease-in-out infinite}
#lc.off{pointer-events:none;cursor:default}
@keyframes fl{50%{transform:translateY(-7px)}}
#lci{filter:drop-shadow(4px 4px 0 var(--pink))}#lci canvas{width:100%;display:block}
#lci.sq{animation:sqz .4s ease-out}
@keyframes sqz{30%{transform:scale(1.25,.78)}60%{transform:scale(.9,1.15)}}
.pt{position:absolute;left:50%;top:35%;margin:-10px;pointer-events:none;z-index:3;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) scale(.4);opacity:1}35%{transform:translate(calc(var(--dx)*.6),var(--uy)) scale(1.1)}100%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:0}}
#th{position:absolute;right:-38px;top:-4px;display:flex;gap:5px;opacity:0;transition:opacity .5s}
#th.on{opacity:1}
#th i{width:8px;height:8px;background:#fff;box-shadow:2px 2px 0 var(--pink);animation:dt 1.2s infinite}
#th i:nth-child(2){animation-delay:.2s}#th i:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}
.bar{width:100%;height:34px;border:4px solid #fff;background:#0a0618;padding:3px;box-shadow:4px 4px 0 var(--pink)}
#bf{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--cy) 0 10px,transparent 10px 13px);transition:width .5s linear}
#lp{margin-top:12px;font-size:10px}
#st{margin-top:14px;min-height:40px;font-size:10px;line-height:1.8;color:#c7f7ff;text-align:center;transition:opacity .3s}
/* ошибка */
#er{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,3,14,.6);opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
#er.on{opacity:1;visibility:visible;transition-delay:0s}
.win{width:min(86vw,340px);background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080,6px 6px 0 rgba(0,0,0,.5);padding:3px;transform:scale(.6);transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
#er.on .win{transform:none}
.tb{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-size:9px;line-height:1;padding:7px 6px;display:flex;justify-content:space-between}
.wb{display:flex;gap:14px;padding:20px 14px;align-items:center;color:#000;font-size:10px;line-height:1.9}
.wb canvas{width:48px;height:48px;flex:none}.wb small{font-size:8px}
.bs{display:flex;justify-content:center;gap:12px;padding:0 10px 14px}
.wbt{font:400 10px 'Press Start 2P',monospace;min-width:90px;padding:10px;background:#c0c0c0;color:#000;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px #808080;cursor:pointer}
.wbt:active{border-color:#404040 #fff #fff #404040}
/* тест и прощание */
#qz{justify-content:center}
.qw{width:min(88vw,380px);display:flex;flex-direction:column;gap:18px}
#qp{display:flex;gap:4px}#qp i{flex:1;height:10px;background:#2a1f45;border:2px solid #120d1c;transition:background .4s}#qp i.d{background:var(--cy)}#qp i.c{background:var(--pink)}
#qn{font-size:10px;color:#c7f7ff;text-align:center}
#qc{position:relative;background:var(--ink);border:4px solid var(--pink);box-shadow:-6px 6px 0 var(--cy);padding:22px 18px;min-height:130px;font-size:12px;line-height:2;white-space:pre-wrap;transition:opacity .4s,transform .4s cubic-bezier(.2,.9,.3,1)}
#qc.in{opacity:0;transform:translateX(50px)}#qc.out{opacity:0;transform:translateX(-50px)}
#qc .ov,#bw .ov{position:absolute}#qc .ov{left:18px;right:18px;top:22px}#bw .ov{left:0;right:0;top:0}
#qa{display:flex;flex-direction:column;gap:12px;transition:opacity .3s}
.qb{font:400 10px/1.8 'Press Start 2P',monospace;text-align:left;color:#120d1c;background:#fff;border:4px solid #120d1c;box-shadow:4px 4px 0 var(--pink);padding:14px;cursor:pointer;opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.3,1),box-shadow .15s,background .25s}
.qb.on{opacity:1;transform:none}
.qb:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pink)}
.qb.sel{background:var(--cy)}
#bye{background:#000;transition:opacity 1.3s ease}
#bw{position:relative;font-size:14px;line-height:2;text-align:center}
/* плавнее вопросы, ошибки, финал */
#qc{min-height:150px;transition:opacity .7s ease,transform .7s cubic-bezier(.25,.8,.25,1)}
#qc.in{opacity:0;transform:translateY(24px) scale(.98)}#qc.out{opacity:0;transform:translateY(-18px) scale(.98)}
#qa{min-height:236px;transition:opacity .6s ease}
.qb{transition:opacity .6s ease,transform .6s cubic-bezier(.25,.8,.25,1),box-shadow .15s,background .25s}
.qb.on.bad{background:#ffb3c1;opacity:.5;pointer-events:none;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#nope{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 22px);left:50%;margin-left:-130px;width:260px;text-align:center;background:#fff;color:#120d1c;border:4px solid #120d1c;box-shadow:4px 4px 0 var(--pink);padding:14px 10px;font-size:10px;line-height:1.8;transform:translateY(-260px);transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
#nope.on{transform:none}
.fw{width:min(88vw,380px);display:flex;flex-direction:column;align-items:center;gap:22px}
#fc{position:relative;width:150px}
.v.on #fc{animation:peek .9s cubic-bezier(.2,1.4,.4,1) .3s backwards}
@keyframes peek{from{transform:translateY(110px) scale(.7);opacity:0}}
#fci{filter:drop-shadow(5px 5px 0 var(--pink));animation:fl 2.4s ease-in-out infinite}#fci canvas{width:100%;display:block}
#fci.sq{animation:sqz .4s ease-out}
#fd{position:relative;width:100%;background:var(--ink);border:4px solid var(--pink);box-shadow:-6px 6px 0 var(--cy);padding:22px 18px;min-height:150px;font-size:12px;line-height:2;white-space:pre-wrap;transition:opacity .35s}
#fd .ov{position:absolute;left:18px;right:18px;top:22px}
#gw{height:70px;display:flex;justify-content:center;align-items:flex-start}
.go{font:400 14px 'Press Start 2P',monospace;background:#ffd23f;color:#120d1c;border:4px solid #120d1c;box-shadow:4px 4px 0 #fff;padding:16px 24px;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(-240px) rotate(-6deg);transition:opacity .3s,transform .9s cubic-bezier(.3,1.7,.5,1)}
.go.on{opacity:1;pointer-events:auto;transform:none}
.go.gone{opacity:0;pointer-events:none;transform:translateY(20px) scale(.9);transition:opacity .5s,transform .5s}
/* плавность вопросов */
#qc{transition:opacity .9s ease,transform .9s cubic-bezier(.22,.61,.36,1),filter .9s ease}
#qc.in{opacity:0;transform:translateY(26px) scale(.98);filter:blur(4px)}#qc.out{opacity:0;transform:translateY(-20px) scale(.98);filter:blur(4px)}
#qa{transition:opacity .8s ease}#qp i{transition:background .8s ease}
.qb{transform:translateY(18px) scale(.98);transition:opacity .7s ease,transform .7s cubic-bezier(.22,.61,.36,1),box-shadow .15s,background .3s}
/* сцена со звёздочкой */
#fin,#sc{transition:opacity .4s ease,transform .4s ease,visibility 0s linear .4s}#fin.on,#sc.on{transition-delay:0s}
#sc{inset:0;padding:0;background:#06030c}
.wr{width:100%;max-width:520px}
.st{position:relative;height:min(40vh,300px);border-block:3px solid #fff;background:#12092a;overflow:hidden}
#rb{position:absolute;inset:0;background:linear-gradient(115deg,#ff2e88,#7a3cff,#2ee6d6,#ffd23f,#ff2e88);background-size:400% 400%;animation:gs 12s ease-in-out infinite}
#rb:after{content:"";position:absolute;inset:0;background:repeating-conic-gradient(rgba(18,13,28,.28) 0 25%,transparent 0 50%) 0 0/4px 4px}
@keyframes gs{50%{background-position:100% 50%}}
#pn2{position:absolute;inset:0}
.v.on #pn2{animation:sl2 .7s cubic-bezier(.2,1.2,.4,1) .1s backwards}
@keyframes sl2{from{transform:translateX(-100%)}}
.pk,.pw,.pp{position:absolute;top:0;bottom:0;left:0}
.pk{width:calc(56% + 14px);background:#ff2e88;clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
.pw{width:calc(56% + 5px);background:#fff;clip-path:polygon(0 0,100% 0,84% 100%,0 100%)}
.pp{width:56%;background:linear-gradient(160deg,#a47bff,#5b2bd1);clip-path:polygon(0 0,100% 0,84% 100%,0 100%);overflow:hidden}
.pp:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffe27a,#ff9f1c);opacity:0;transition:opacity .9s}
.pp.gold:after{opacity:1}
.ac{position:absolute;inset:0;z-index:1;display:flex;align-items:center;padding-left:7%;transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .9s}
.ac>div{width:60%}.ac canvas{width:100%;display:block}
#ca{filter:drop-shadow(5px 5px 0 var(--pink));animation:sw 1.5s ease-in-out infinite alternate;transform-origin:50% 90%}
#ca.hop,#sa.hype{animation:hop .5s ease-in-out infinite}
#ca.conf{animation:conf 1.1s ease-in-out infinite}
#ca.up{animation:lookup 1s ease-out forwards}
@keyframes hop{50%{transform:translateY(-18px) scale(1.05,.95)}}
@keyframes conf{25%{transform:rotate(-10deg) translateX(-6px)}75%{transform:rotate(10deg) translateX(6px)}}
@keyframes lookup{to{transform:translateY(-12px) scale(1.08) rotate(-5deg)}}
@keyframes sw{from{transform:rotate(-6deg) translateY(0)}to{transform:rotate(6deg) translateY(-9px)}}
#cw.out{transform:translateY(130%);opacity:0}
#sw{transform:translateY(-140%);opacity:0;transition:none}
#sw.in{transform:none;opacity:1;transition:transform 1.1s cubic-bezier(.2,1.5,.4,1),opacity .4s}
#sa{filter:drop-shadow(0 0 10px #ffd23f);animation:twk 1.6s ease-in-out infinite}
@keyframes twk{50%{transform:rotate(7deg) scale(1.08)}}
#sa.look{animation:look 1.1s ease-out forwards}
@keyframes look{to{transform:rotate(16deg) translateX(10%) scale(1.06)}}
#qm{position:absolute;z-index:2;left:56%;top:12%;font-size:26px;color:#fff;text-shadow:3px 3px 0 var(--pink);opacity:0}
#qm.on{animation:qmk 1.2s ease-out infinite}
@keyframes qmk{0%{opacity:0;transform:translateY(10px) scale(.5)}30%{opacity:1;transform:translateY(-6px) scale(1.2)}100%{opacity:0;transform:translateY(-28px)}}
.gifts{position:absolute;right:0;top:0;bottom:0;width:46%;display:flex;align-items:center;justify-content:space-around;padding-right:3%}
.gf{width:min(17vw,76px);opacity:0;transform:scale(.2) translateY(40px);transition:opacity .6s,transform .9s cubic-bezier(.2,1.6,.4,1)}
.gf.on{opacity:1;transform:none}
.gi{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.35))}.gi canvas{width:100%;display:block}
#g1 .gi{animation:j1 1.3s ease-in-out infinite}#g2 .gi{animation:j2 1.7s ease-in-out .3s infinite}
.gifts.hype .gi{animation-duration:.5s}
@keyframes j1{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes j2{0%,100%{transform:translateY(-4px) rotate(3deg)}50%{transform:translateY(-16px) rotate(-4deg) scale(1.04,.97)}}
#sd{position:relative;min-height:150px;padding:24px 20px;font-size:12px;line-height:2.1;color:#c7f7ff;text-shadow:2px 2px 0 #7a1b7a;white-space:pre-wrap;transition:opacity .3s}
#sd.s{color:#ffe27a;text-shadow:2px 2px 0 #b3401f}
#sd .ov{position:absolute;left:20px;right:20px;top:24px}
#sg{height:70px;display:flex;justify-content:center}
/* полировка сцены */
#ca{animation:none}
#sa{position:relative;filter:drop-shadow(0 0 8px #ffd23f) drop-shadow(0 0 22px #ffb300);animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 14px #ffe27a) drop-shadow(0 0 40px #ff9f1c)}}
#sa:before{content:"";position:absolute;inset:-45%;background:radial-gradient(circle,rgba(255,210,63,.6),transparent 62%);z-index:-1;animation:halo 2s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.18);opacity:.75}}
.pp:after{background:radial-gradient(#fff 1px,transparent 1.5px) 0 0/22px 26px,linear-gradient(160deg,#1b1450,#05030c)}
.pp.night:after{opacity:1}
#dim,#glow{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0}
#dim{background:radial-gradient(circle at var(--sx) var(--sy),transparent 0,transparent var(--sr),rgba(3,1,10,.85) calc(var(--sr)*2.6));transition:opacity .8s ease}
#glow{background:radial-gradient(circle at var(--sx) var(--sy),rgba(255,235,150,.9),rgba(255,200,60,.28) 40%,transparent 72%)}
.gf.shk{animation:rattle .6s}
@keyframes rattle{10%,50%,90%{transform:translateX(-6px) rotate(-6deg)}30%,70%{transform:translateX(6px) rotate(6deg)}}
.st.shk{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}
#dv{position:fixed;z-index:9;top:6px;right:6px;font:400 8px 'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#dv button{font:inherit;color:#fff;background:rgba(10,6,20,.85);border:2px solid #fff;padding:6px 8px;cursor:pointer;text-align:left}
#dvb{opacity:.55}#dvl{display:none;flex-direction:column;gap:4px}#dvl.on{display:flex}#dv .cur{background:#ff2e88}
.v.on #pn2{animation:none}
#cw{transition:transform 1.1s cubic-bezier(.2,1.25,.4,1),opacity .6s}
#cw.out{transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .9s}
.rmb{animation:rmb .09s linear infinite}
@keyframes rmb{0%{transform:translate(var(--ra),0)}25%{transform:translate(0,var(--ra))}50%{transform:translate(calc(var(--ra)*-1),0)}75%{transform:translate(0,calc(var(--ra)*-1))}100%{transform:translate(var(--ra),0)}}
/* интро кафе и игра */
#cf{inset:0;background:#000;justify-content:center;gap:34px}
.sx{width:130px;transition:transform 1.2s cubic-bezier(.5,0,.9,.4),opacity 1.2s}.sx.up{transform:translateY(-130vh)}
#cs{position:relative;filter:drop-shadow(0 0 8px #ffd23f) drop-shadow(0 0 26px #ffb300);animation:glow 2s ease-in-out infinite}
#cs:before{content:"";position:absolute;inset:-45%;background:radial-gradient(circle,rgba(255,210,63,.55),transparent 62%);z-index:-1}
#cs canvas{width:100%;display:block}
#cd{position:relative;width:min(88vw,380px);min-height:130px;font-size:12px;line-height:2.1;color:#ffe27a;text-shadow:2px 2px 0 #b3401f;text-align:center;white-space:pre-wrap}
#cd .ov{position:absolute;left:0;right:0;top:0}
#gm{inset:0;padding:0;background:#120d1c;justify-content:center}
#gmw{position:relative;overflow:hidden;flex:none}#gmw.shk{animation:shake .45s}
#gmw>canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#gh{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
#hr{display:flex;align-items:center}#hs{display:flex;gap:4px}#hs canvas{width:21px;height:18px}#hs .lost{filter:grayscale(1) brightness(.35)}
#cb{font-size:12px;color:#ffd23f;text-shadow:2px 2px 0 #b3401f;margin-left:8px}
#wl{font-size:7px;color:#fff;text-shadow:1px 1px 0 #120d1c}
#gsw{position:absolute;left:8px;top:54px;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
#gsc{width:58px;height:58px;filter:drop-shadow(0 0 10px #ffd23f) drop-shadow(0 0 26px #ffb300);animation:glow 2s ease-in-out infinite}
#gsb{font-size:11px;margin-left:2px;line-height:1.7;background:#fff;color:#120d1c;border:4px solid #120d1c;box-shadow:0 0 0 3px #ffd23f,4px 4px 0 rgba(0,0,0,.4);padding:8px 9px;margin-top:7px;max-width:190px;opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
#gsb.on{opacity:1;transform:none}
#gbn{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s;pointer-events:none}
#gbn.on{opacity:1;visibility:visible;transition-delay:0s}
.gbb{font-size:16px;line-height:1.4;color:#fff;text-shadow:3px 3px 0 #ff2e88;background:rgba(9,5,22,.86);border:4px solid #fff;box-shadow:0 0 0 4px #ff2e88,7px 9px 0 rgba(0,0,0,.45);padding:18px 24px;white-space:nowrap;opacity:0}
.gbb.pop{animation:gbp .45s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes gbp{0%{opacity:0;transform:scale(.25) rotate(-7deg)}55%{opacity:1}100%{opacity:1;transform:none}}
.gbb.go{color:#120d1c;background:#ffd23f;border-color:#120d1c;text-shadow:2px 2px 0 #fff;box-shadow:0 0 0 4px #fff,7px 9px 0 rgba(0,0,0,.45)}
.gp{position:absolute;transform:translate(-50%,0);font-size:8px;text-shadow:2px 2px 0 #120d1c;white-space:nowrap;pointer-events:none;animation:gpu .9s ease-out forwards}
@keyframes gpu{to{transform:translate(-50%,-40px);opacity:0}}
#gov{position:absolute;inset:0;background:rgba(6,3,12,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#gov.on{opacity:1;visibility:visible;transition-delay:0s}
.gt{font-size:12px;line-height:2.1;color:#ffe27a;text-shadow:2px 2px 0 #b3401f}
/* плавный текст, переход, фон кафе */
.sc{opacity:0;animation:scin .55s ease forwards}
@keyframes scin{0%{opacity:0;text-shadow:0 0 14px #ffd23f}55%{opacity:1;text-shadow:0 0 12px #ffd23f}100%{opacity:1}}
#cf{background:radial-gradient(circle at 50% 36%,rgba(255,200,60,.17),transparent 52%),#000}
#cd{transition:opacity .9s ease}
#gm{background:radial-gradient(circle at 50% 100%,#5b1e78,transparent 60%),linear-gradient(#090521,#1d0b44);clip-path:circle(0% at 50% 22%)}
#gm.rev{clip-path:circle(150% at 50% 22%);transition:clip-path 1.8s cubic-bezier(.3,.6,.2,1),opacity .6s ease,transform .6s ease,visibility 0s}
#gmw{transition:transform 2.2s cubic-bezier(.2,.7,.2,1),filter 1.8s ease}
#gmw.pre{transform:scale(1.25);filter:brightness(1.7) blur(2px)}
#gfl{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 22%,#fff7c0,#ffd23f 38%,transparent 75%)}
#gfl.go{animation:gfl 1.9s ease-out}

 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=NB;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(up?300:2400,t);f.frequency.exponentialRampToValueAtTime(up?2600:260,t+d);
 g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+d*.35);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.05)}catch(e){}}
